<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-SERVER · Cloud Node Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --surface: #11141e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #2563eb;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
    }
    .logo-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #38bdf8;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: var(--text-dim);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: #090b10;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: var(--primary);
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      border: none;
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      transition: background 0.15s;
    }
    .btn-submit:hover {
      background: #1d4ed8;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--emerald);
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: var(--emerald);
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo-header">
      <div class="brand-icon">R</div>
      <h1 class="title">R-SERVER</h1>
      <p class="subtitle">Cloud Node Dashboard Control</p>
      <div class="status-badge">
        <span class="dot"></span> Singapore Cluster (Online)
      </div>
    </div>

    <div class="error-msg" id="errorBox">Password salah. Silakan coba lagi.</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="password">ROOT PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Masukkan password root VPS" required autofocus autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>Masuk Dashboard</span> &rarr;
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');
      const submitBtn = document.getElementById('submitBtn');

      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Memverifikasi...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          submitBtn.innerText = 'Berhasil! Mengalihkan...';
          window.location.href = '/';
        } else {
          errorBox.innerText = data.error || 'Password salah';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Masuk Dashboard</span> &rarr;';
        }
      } catch (err) {
        errorBox.innerText = 'Gagal terhubung ke server.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Masuk Dashboard</span> &rarr;';
      }
    }
  </script>
</body>
</html>
